<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Focus Lab Feed</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0d10; --surface:#14181f; --surface2:#1b212a; --border:#28303b;
    --text:#f2f5f9; --dim:#93a0b0; --accent:#4c8dff; --danger:#ff5a5f;
    --tw:#1d9bf0; --th:#eef1f5; --ig:#ff4d94; --yt:#ff453a; --li:#4a9eda;
    /* Comfortable density (per Feed Viewer design). */
    --radius:20px; --pad:18px; --gap:12px;
    --brand:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { max-width:600px; margin:0 auto; min-height:100dvh; padding-bottom:env(safe-area-inset-bottom); position:relative; }
  ::-webkit-scrollbar { display:none; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { color:#7fb0ff; }
  @keyframes fl-rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* ---------------- Header ---------------- */
  header.feed-head {
    position:sticky; top:0; z-index:20;
    background:rgba(11,13,16,0.72);
    backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px;
    padding:11px 16px; padding-top:calc(11px + env(safe-area-inset-top));
  }
  header.feed-head .logo { flex:0 0 auto; }
  header.feed-head .title { flex:1; min-width:0; }
  header.feed-head .title .pack {
    font-family:var(--brand); font-size:15px; font-weight:700; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);
  }
  header.feed-head .title .stats { font-size:12px; color:var(--dim); }
  #day-select {
    flex:0 0 auto; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-size:13px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }

  .status { padding:70px 24px; text-align:center; color:var(--dim); font-size:15px; }
  .status.error { color:var(--danger); }

  /* ---------------- Feed ---------------- */
  #posts { display:flex; flex-direction:column; gap:var(--gap); padding:var(--gap) 0 60px; }
  .post { background:var(--surface); padding:var(--pad); animation:fl-rise .35s ease both; }

  .repost-note {
    display:flex; align-items:center; gap:6px; color:var(--dim);
    font-size:12.5px; font-weight:600; margin-bottom:11px;
  }

  .post-header { display:flex; gap:11px; align-items:center; margin-bottom:12px; }
  .avatar {
    flex:0 0 auto; width:42px; height:42px; border-radius:50%; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; font-family:var(--brand);
  }
  .who { flex:1; min-width:0; }
  .who .line1 { display:flex; align-items:center; gap:7px; min-width:0; }
  .name { font-weight:700; font-size:15px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score {
    flex:0 0 auto; display:inline-flex; align-items:center; gap:3px;
    padding:2px 7px; border-radius:8px; background:rgba(76,141,255,0.14);
    color:var(--accent); font-size:11px; font-weight:700;
  }
  .who .line2 { display:flex; align-items:center; gap:8px; margin-top:1px; }
  .handle { color:var(--dim); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .time { flex:0 0 auto; color:var(--dim); font-size:13px; }
  .badge {
    flex:0 0 auto; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 9px; border-radius:999px;
  }
  .badge.x, .badge.twitter { background:rgba(29,155,240,0.16); color:var(--tw); }
  .badge.threads { background:rgba(255,255,255,0.09); color:var(--th); }
  .badge.instagram { background:rgba(255,77,148,0.16); color:var(--ig); }
  .badge.youtube { background:rgba(255,69,58,0.16); color:var(--yt); }
  .badge.linkedin { background:rgba(74,158,218,0.16); color:var(--li); }

  .reason {
    display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--dim);
    line-height:1.45; margin-bottom:11px; padding:9px 12px; background:var(--surface2); border-radius:12px;
  }
  .reason svg { flex:0 0 auto; margin-top:1px; }
  .reason span { font-style:italic; }

  .post-text { font-size:15.5px; line-height:1.55; color:var(--text); white-space:pre-wrap; word-wrap:break-word; margin-bottom:12px; }

  /* ---------------- Media ---------------- */
  .media-wrap { position:relative; border-radius:16px; overflow:hidden; background:#000; margin-bottom:12px; border:1px solid var(--border); }
  .carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .carousel::-webkit-scrollbar { display:none; }
  .mslide { flex:0 0 100%; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
  .mslide img, .mslide video { width:100%; display:block; max-height:78vh; object-fit:contain; }
  img.remote-failed { display:none; }
  .counter {
    position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    color:#fff; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; pointer-events:none;
  }

  /* Custom video controls (no native controls — they fought the autoplay/mute). */
  .vctl { position:absolute; bottom:10px; right:10px; display:flex; gap:8px; z-index:2; }
  .vbtn {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    color:#fff; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .vbtn:active { transform:scale(0.92); }
  /* Center play glyph shown while a video is paused. */
  .vpaused-glyph {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    pointer-events:none; z-index:1;
  }
  .vpaused-glyph > div {
    width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,0.5);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  .mslide.paused .vpaused-glyph { display:flex; }

  /* Link-out card (large videos / YouTube — served from source, not the bucket). */
  .linkout { display:block; position:relative; width:100%; text-decoration:none; background:#000; min-height:150px; }
  .linkout img { width:100%; display:block; max-height:60vh; object-fit:cover; opacity:0.5; }
  .linkout .lo-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:22px; text-align:center; }
  .linkout .lo-play { width:56px; height:56px; border-radius:50%; background:rgba(76,141,255,0.92); color:#fff; display:flex; align-items:center; justify-content:center; }
  .linkout .lo-label { color:#fff; font-size:14px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,0.8); }

  /* ---------------- Quoted + engagement ---------------- */
  .quoted { border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:12px; background:var(--surface2); }
  .quoted .q-head { display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }
  .quoted .q-name { font-weight:700; font-size:13.5px; color:var(--text); }
  .quoted .q-handle { color:var(--dim); font-size:12.5px; }
  .quoted .q-text { font-size:14px; line-height:1.5; color:var(--text); white-space:pre-wrap; word-wrap:break-word; }

  .engage { display:flex; align-items:center; gap:22px; color:var(--dim); font-size:13px; margin-top:4px; }
  .engage .stat { display:flex; align-items:center; gap:6px; }
  .engage .open { margin-left:auto; display:flex; align-items:center; gap:4px; color:var(--dim); font-size:12.5px; }

  .end-note { padding:44px 24px 60px; text-align:center; color:var(--dim); font-size:13.5px; line-height:1.6; }
</style>
</head>
<body>

<header class="feed-head">
  <svg class="logo" width="26" height="26" viewBox="0 0 400 400" aria-hidden="true">
    <path d="M 190 25 C 235 15, 295 50, 335 85 C 375 115, 385 160, 380 200 C 375 255, 355 300, 315 330 C 275 360, 225 390, 175 385 C 125 380, 75 360, 55 315 C 35 270, 25 215, 45 175 C 65 135, 95 90, 135 65 C 165 45, 175 30, 190 25 Z" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 185 160 C 220 145, 260 175, 275 205 C 290 235, 280 280, 250 300 C 220 320, 175 315, 145 295 C 115 275, 110 235, 125 200 C 140 165, 165 165, 185 160 Z" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </svg>
  <div class="title">
    <div class="pack">Focus Lab Feed</div>
    <div class="stats" id="feed-stats">loading…</div>
  </div>
  <select id="day-select" hidden></select>
</header>
<div id="status" class="status">Loading feed…</div>
<div id="posts"></div>

<script>
(function () {
  'use strict';

  const state = { day: null, posts: [] };
  const $ = (id) => document.getElementById(id);
  const base = () => `feed/${state.day}/`;

  // ---------------- Inline icons (Lucide-style, matches Feed Viewer design) ----
  const IC = {
    repost: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
    search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    heart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>',
    reply: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
    ext: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5v14l11-7z"/></svg>',
    playSmall: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    volOn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    volOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>',
  };

  // ---------------- Per-day scroll-anchor memory ----------------
  const anchorKey = () => `focuslab:anchor:${state.day}`;
  function findAnchorPostId() {
    const posts = document.querySelectorAll('#posts .post');
    for (const p of posts) if (p.getBoundingClientRect().bottom > 80) return p.dataset.id;
    return null;
  }
  function saveAnchor() {
    if (!state.day) return;
    const id = findAnchorPostId();
    if (id) { try { localStorage.setItem(anchorKey(), id); } catch (e) {} }
  }
  function restoreAnchor() {
    let id = null;
    try { id = localStorage.getItem(anchorKey()); } catch (e) { return; }
    if (!id) return;
    const target = document.querySelector(`.post[data-id="${CSS.escape(id)}"]`);
    if (!target) return;
    const go = () => window.scrollTo(0, target.getBoundingClientRect().top + window.scrollY - 70);
    requestAnimationFrame(go); setTimeout(go, 300); setTimeout(go, 1000);
  }

  // ---------------- Helpers ----------------
  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linkify(text) {
    return escapeHTML(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function relTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const s = Math.max(1, Math.floor((Date.now() - d.getTime()) / 1000));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    if (s < 2592000) return Math.floor(s / 86400) + 'd';
    return d.toISOString().slice(0, 10);
  }
  function formatNum(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }
  function initials(name) {
    const parts = String(name || '').trim().replace(/^@/, '').split(/[\s_]+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function avatarColor(seed) {
    let h = 0; seed = String(seed || '');
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360} 55% 42%)`;
  }

  // ---------------- Media ----------------
  function mediaElement(item) {
    if (!item) return '';
    if (item.type === 'video') {
      return `<div class="mslide video">
        <video src="${escapeHTML(base() + item.src)}" playsinline muted loop preload="metadata"></video>
        <div class="vpaused-glyph"><div>${IC.play}</div></div>
        <div class="vctl">
          <button class="vbtn" data-vact="playpause" aria-label="Play or pause">${IC.pause}</button>
          <button class="vbtn" data-vact="mute" aria-label="Mute or unmute">${IC.volOff}</button>
        </div>
      </div>`;
    }
    if (item.type === 'image') {
      const src = item.remote ? item.src : base() + item.src;
      const onerr = item.remote ? ` onerror="this.classList.add('remote-failed')"` : '';
      return `<div class="mslide"><img src="${escapeHTML(src)}" loading="lazy" alt=""${onerr}></div>`;
    }
    if (item.type === 'linkout') {
      const poster = item.poster ? `<img src="${escapeHTML(base() + item.poster)}" alt="">` : '';
      return `<div class="mslide"><a class="linkout" href="${escapeHTML(item.url)}" target="_blank" rel="noopener">
        ${poster}
        <div class="lo-overlay"><div class="lo-play">${IC.play}</div><div class="lo-label">${escapeHTML(item.label || 'Watch at source')}</div></div>
      </a></div>`;
    }
    return '';
  }

  function renderMedia(post) {
    let items = post.hosted_media;
    if (!Array.isArray(items)) {
      items = (post.media_urls || []).map(u => ({ type: 'image', src: u, remote: true }));
    }
    items = items.filter(Boolean);
    if (items.length === 0) return '';
    const slides = items.map(mediaElement).join('');
    const counter = items.length > 1 ? `<div class="counter" data-counter>1 / ${items.length}</div>` : '';
    return `<div class="media-wrap"><div class="carousel" data-carousel>${slides}</div>${counter}</div>`;
  }

  function renderQuoted(q) {
    if (!q) return '';
    const name = escapeHTML(q.author_name || q.author_handle || '');
    const handle = q.author_handle ? '@' + escapeHTML(q.author_handle) : '';
    return `<div class="quoted">
      <div class="q-head"><span class="q-name">${name}</span><span class="q-handle">${handle}</span></div>
      <div class="q-text">${linkify(q.text || '')}</div>
    </div>`;
  }

  function renderPost(post) {
    const platform = (post.platform || '').toLowerCase();
    const badgeClass = ['x','twitter','threads','instagram','youtube','linkedin'].includes(platform) ? platform : '';
    const name = post.author_name || post.author_handle || 'Unknown';
    const handle = post.author_handle ? '@' + escapeHTML(post.author_handle) : '';
    const time = relTime(post.created_at);

    const repost = (post.is_repost && post.original_author)
      ? `<div class="repost-note">${IC.repost} reposted by @${escapeHTML(post.original_author)}</div>` : '';
    const score = typeof post.score === 'number'
      ? `<span class="score">★ ${post.score}</span>` : '';
    const badge = badgeClass ? `<span class="badge ${badgeClass}">${escapeHTML(platform)}</span>` : '';
    const reason = post.filter_reason
      ? `<div class="reason">${IC.search}<span>${escapeHTML(post.filter_reason)}</span></div>` : '';
    const text = post.text ? `<div class="post-text">${linkify(post.text)}</div>` : '';
    const media = renderMedia(post);
    const quoted = renderQuoted(post.quoted_post);

    const likes = post.likes ? `<span class="stat">${IC.heart}${formatNum(post.likes)}</span>` : '';
    const reposts = post.reposts ? `<span class="stat">${IC.repost}${formatNum(post.reposts)}</span>` : '';
    const replies = post.replies ? `<span class="stat">${IC.reply}${formatNum(post.replies)}</span>` : '';
    const open = post.url
      ? `<a class="open" href="${escapeHTML(post.url)}" target="_blank" rel="noopener">open${platform ? ' on ' + escapeHTML(platform) : ''} ${IC.ext}</a>` : '';

    return `<article class="post" data-id="${escapeHTML(post.id || '')}">
      ${repost}
      <div class="post-header">
        <div class="avatar" style="background:${avatarColor(post.author_handle || name)}">${escapeHTML(initials(name))}</div>
        <div class="who">
          <div class="line1"><span class="name">${escapeHTML(name)}</span>${score}</div>
          <div class="line2"><span class="handle">${handle}</span>${time ? `<span class="time">· ${time}</span>` : ''}</div>
        </div>
        ${badge}
      </div>
      ${reason}
      ${text}
      ${media}
      ${quoted}
      <div class="engage">${likes}${reposts}${replies}${open}</div>
    </article>`;
  }

  // ---------------- Feed wiring (video controls, carousel counters) ----------
  function wireVideo(slide) {
    const v = slide.querySelector('video');
    if (!v) return;
    const btnPlay = slide.querySelector('[data-vact="playpause"]');
    const btnMute = slide.querySelector('[data-vact="mute"]');

    const syncPlay = () => {
      btnPlay.innerHTML = v.paused ? IC.playSmall : IC.pause;
      slide.classList.toggle('paused', v.paused);
    };
    const syncMute = () => { btnMute.innerHTML = v.muted ? IC.volOff : IC.volOn; };
    v.addEventListener('play', syncPlay);
    v.addEventListener('pause', syncPlay);
    v.addEventListener('volumechange', syncMute);
    syncPlay(); syncMute();

    // Play/pause button — an explicit pause here sticks: the autoplay observer
    // won't restart a video the user paused (dataset.userPaused), so the two
    // no longer fight.
    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (v.paused) { delete v.dataset.userPaused; v.play().catch(() => {}); }
      else { v.dataset.userPaused = '1'; v.pause(); }
    });
    // Mute button — the only thing that changes audio. No native controls to fight.
    btnMute.addEventListener('click', (e) => { e.stopPropagation(); v.muted = !v.muted; });
    // Tapping the frame is a convenience play/pause toggle.
    v.addEventListener('click', () => {
      if (v.paused) { delete v.dataset.userPaused; v.play().catch(() => {}); }
      else { v.dataset.userPaused = '1'; v.pause(); }
    });
  }

  function setupVideoAutoplay() {
    const slides = document.querySelectorAll('#posts .mslide.video');
    slides.forEach(wireVideo);

    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        const v = e.target;
        if (e.isIntersecting && e.intersectionRatio > 0.6) {
          if (!v.dataset.userPaused) v.play().catch(() => {});  // muted autoplay in focus
        } else {
          v.pause();  // leaving view pauses, but doesn't count as a user pause
        }
      }
    }, { threshold: [0, 0.6, 1] });
    slides.forEach(s => { const v = s.querySelector('video'); if (v) io.observe(v); });
  }

  function setupCarousels() {
    document.querySelectorAll('#posts [data-carousel]').forEach(car => {
      const counter = car.parentElement.querySelector('[data-counter]');
      if (!counter || car.children.length < 2) return;
      const total = car.children.length;
      const upd = () => { counter.textContent = (Math.round(car.scrollLeft / Math.max(car.clientWidth, 1)) + 1) + ' / ' + total; };
      car.addEventListener('scroll', upd, { passive: true });
      upd();
    });
  }

  // ---------------- Loading ----------------
  function showStatus(msg, isError) {
    const el = $('status'); el.textContent = msg; el.classList.toggle('error', !!isError); el.hidden = false;
  }
  async function fetchJSON(path) {
    const r = await fetch(path, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
    return r.json();
  }

  async function loadDay(day) {
    state.day = day;
    showStatus('Loading feed…');
    $('posts').innerHTML = '';
    let data;
    try { data = await fetchJSON(`feed/${day}/posts.json`); }
    catch (e) { showStatus(`Couldn't load ${day}: ${e.message}`, true); return; }

    state.posts = data.posts || [];
    const pub = data.publish_metadata || {};
    $('feed-stats').textContent =
      `${day} · ${state.posts.length} posts` + (pub.media_mb ? ` · ${pub.media_mb} MB media` : '');
    $('status').hidden = true;
    $('posts').innerHTML =
      (state.posts.map(renderPost).join('') || '<div class="status">No posts this day.</div>') +
      `<div class="end-note">That's your feed for ${day}.<br>Go live your life. 🌱</div>`;
    window.scrollTo(0, 0);
    setupVideoAutoplay();
    setupCarousels();
    restoreAnchor();
  }

  async function init() {
    let anchorTimer = null;
    window.addEventListener('scroll', () => {
      if (anchorTimer) return;
      anchorTimer = setTimeout(() => { anchorTimer = null; saveAnchor(); }, 400);
    }, { passive: true });

    let index;
    try { index = await fetchJSON('feed/index.json'); }
    catch (e) { showStatus(`Couldn't load feed index: ${e.message}`, true); return; }

    const days = (index.days || []).map(d => d.day);
    if (days.length === 0) {
      showStatus('No published days yet. Run the curator with publishing enabled.');
      return;
    }
    const select = $('day-select');
    select.innerHTML = days.map(d => `<option value="${d}">${d}</option>`).join('');
    select.hidden = days.length < 2;
    select.onchange = () => loadDay(select.value);
    await loadDay(days[0]);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
